plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.amio'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.amio"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Added for PreferenceManager and SharedPreferences support
    implementation 'androidx.preference:preference:1.2.1'

    // Email notification dependencies - Using simple HTTP POST
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

}