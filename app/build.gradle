plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.amio'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.amio"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Added for PreferenceManager and SharedPreferences support
    implementation 'androidx.preference:preference:1.2.1'

    // Email notification dependencies - NotificationAPI SDK
    implementation 'com.notificationapi:notificationapi-java-server-sdk:0.3.0'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

}